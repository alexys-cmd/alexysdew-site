name: Sync Medium posts
on:
  schedule:
    - cron: "17 11 * * *"   # every day, about 6–7 am Eastern
  workflow_dispatch:         # lets you run it by hand from the Actions tab
permissions:
  contents: write
  pages: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-medium.mjs
      - name: Save new posts
        run: |
          if ! git diff --quiet; then
            git config user.name "blog-sync"
            git config user.email "blog-sync@users.noreply.github.com"
            git commit -am "Add new Medium posts"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds"   # republish the site
          fi
        env:
          GH_TOKEN: ${{ github.token }}
